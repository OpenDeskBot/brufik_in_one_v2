[build-system]
requires = ["setuptools>=61,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "deskbot-server"
version = "0.1.0"
description = "OpenDesk voice robot backend (ASR + LLM + TTS + ESP32 pb protocol)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets==14.2",
    "PyYAML==6.0.2",
    "numpy==1.26.4",
    "opuslib_next==1.1.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.9",
    "SQLAlchemy==2.0.41",
    "Pillow>=12.2.0",
    # onnxruntime 为主服务进程内 Silero VAD 使用；mediapipe/insightface/opencv 等
    # 模型推理依赖已随人脸/ASR/TTS/声纹/LLM 迁入各外部服务独立 venv（externals/*/install.sh）
    "onnxruntime>=1.17.0",
    "croniter==2.0.7",
    "pypinyin>=0.53.0",
    "g2p-en>=2.1.0",
    "pyserial>=3.5",
    # werkzeug.security 用户密码哈希（scrypt，登录/改密用）
    "Werkzeug==3.1.8",
    # jinja2 Web 控制台模板渲染（web/mount.py 顶层 import Jinja2Templates）
    "Jinja2==3.1.6",
    # itsdangerous 调试 WS token（auth/debug_ws_token.py 顶层 import）
    "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
    "sounddevice==0.5.3",
    "ruff>=0.9",
    "pytest>=8.0",
]
# miloco-miot 需从 iotctl/wheels 本地安装：
#   pip install --no-deps src/deskbot_server/iotctl/wheels/miloco_miot-*.whl
# aiohttp/aiofiles/pydantic 为 miloco_miot wheel 的运行时依赖
miot = [
    "aiohttp>=3.14.1",
    "aiofiles>=25.1.0",
    "pydantic>=2.13.4",
]

[project.scripts]
deskbot-server = "deskbot_server.__main__:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E   = pycodestyle errors
# F   = pyflakes（未使用 import 等）
# I   = isort（import 排序）
# B   = bugbear（常见 bug 检测）
# UP  = pyupgrade（现代化语法）
# SIM = simplify（简化代码）
ignore = ["E501", "E741"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
