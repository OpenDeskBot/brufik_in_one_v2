# llm-qwen 外部服务契约：本地 Qwen3.8-2B-Distill（Q4_K_M GGUF）OpenAI 兼容服务
# 设计：llama.cpp llama-server 二进制（macOS arm64 官方 release，Metal 加速）+ 本地 GGUF；
# 无 Python 依赖、无独立 venv；OpenAI 兼容 /v1/chat/completions（--jinja 聊天模板）。
# 注意：qwen35（Gated DeltaNet）架构需 llama.cpp ≥ b10360（本服务固定 b10733）；
#       部署参考：https://huggingface.co/empero-ai/Qwen3.8-2B-Distill-GGUF
name: llm-qwen
version: "1.0.0"
type: llm
port: 9106
description: 本地 Qwen3.8-2B-Distill（Q4_K_M · 1.3GB · Metal 加速 · OpenAI 兼容 /v1/chat/completions）
install:
  # install/uninstall 命令在 service 根目录执行，须用相对根目录的路径
  - bash externals/llm-qwen/install.sh
uninstall:
  # 删除二进制与模型（数据目录由管理器自动清理）
  - rm -rf externals/llm-qwen/bin externals/llm-qwen/models
start:
  # llama-server 相对 workdir（externals/llm-qwen）执行；
  # -ngl 99 全部层卸载到 Metal GPU；--jinja 启用 Qwen3.8 聊天模板；--alias 暴露模型名；
  # -rea off 关 think（同 minicpm 经验：content 不被思考吃掉，提速）
  # -c 8192 = 模型 n_ctx_train 上限（再大被 llama.cpp clamp，需 rope-scaling 才能超）；
  #   上下文超限由主服务侧按预估裁剪历史并 400 重试兜底，不要单独调大
  command:
    - bin/llama-server
    - -m
    - models/Qwen3.8-2B-Q4_K_M.gguf
    - --host
    - 127.0.0.1
    - --port
    - "9106"
    - -ngl
    - "99"
    - -c
    - "8192"
    - --jinja
    - -rea
    - "off"
    - --alias
    - qwen3.8-2b
  workdir: ./externals/llm-qwen
  env: {}
healthcheck:
  type: http
  url: http://127.0.0.1:9106/health
  interval_s: 5
  startup_grace_s: 180 # 模型加载 + Metal 编译缓存；超时后进程仍活只标记 unhealthy 不杀
  timeout_s: 3
  max_failures: 3
auto_start: false
test:
  # llama-server 无 /chat 契约端点，覆盖到真实 OpenAI 端点（默认 llm 契约会 404）
  path: /v1/chat/completions
  method: POST
  json:
    model: qwen3.8-2b
    messages:
      - role: user
        content: 你好，请用一句话介绍你自己。
    max_tokens: 64
    temperature: 0.7
  expect:
    - choices
