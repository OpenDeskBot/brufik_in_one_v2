# insightface-engine 外部服务契约：本地人脸检测与识别（InsightFace + MediaPipe）独立进程
# 设计：完全自包含——独立 venv（.venv，install.sh 幂等）+ 服务目录内模型副本（models/）+
# deskbot_server 运行子集副本（deskbot_server/，随仓库提交，各文件头有同步标记）；
# 运行期零依赖主服务（不读主服务 venv/模型/源码）；配置完全自治——只读同目录 config.yaml。
# 多 worker 并行：config.yaml workers 字段（默认 min(4, CPU 核数)），uvicorn --workers 模式。
name: insightface-engine
version: "1.1.0"
type: fr
port: 9103
description: InsightFace + MediaPipe 本地人脸检测与识别（embedding，独立 venv + 模型副本，完全自包含，多 worker 并行）
install:
  # install/uninstall 命令在 service 根目录执行，须用相对根目录的路径
  - bash externals/insightface-engine/install.sh
uninstall:
  # 删除独立 venv 与模型副本（deskbot_server/ 代码副本随仓库提交，不在此清除；数据目录由管理器自动清理）
  - rm -rf externals/insightface-engine/.venv externals/insightface-engine/models externals/insightface-engine/__pycache__
start:
  # 独立 venv：command 相对 workdir（externals/insightface-engine）执行
  command:
    - .venv/bin/python
    - server.py
    - --host
    - 127.0.0.1
    - --port
    - "9103"
  workdir: ./externals/insightface-engine
  env: {}
healthcheck:
  type: http
  url: http://127.0.0.1:9103/health
  interval_s: 5
  startup_grace_s: 120 # 模型全本地，MediaPipe + InsightFace 加载数秒~数十秒；超时后进程仍活只标记 unhealthy 不杀
  timeout_s: 3
  max_failures: 3
auto_start: true # 主服务默认 HTTP 调用本服务（camera_face.provider=http），须保持运行；用户覆盖持久化在 data/services/state.json
