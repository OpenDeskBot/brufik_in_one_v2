camera_face:
  external_url: http://127.0.0.1:9103
  external_timeout_s: 10
  frame_width: 320
  frame_height: 240
  face_track_max_dist_px: 90
  face_track_max_lost_frames: 18
  horizontal_fov_deg: 120
  eye_yaw_range_deg: 50
  frontal_angle_threshold_deg: 15
  identity_similarity_threshold: 0.4
  mode: insightface
debug:
  asr_auto_reply: true
  live_service: false
  camera_servo_auto_mode: ''
server:
  host: 0.0.0.0
  port: 9000
  ws_path: /asr_chat
  ws_ping_interval: 120
  ws_ping_timeout: 300
  send_face_info_to_asr_chat: false
  asr_chat_device_pb_only: true
  asr_chat_minimal_device_downlink: false
  max_concurrent_asr: 6
audio:
  input_codec: opus
  output_codec: opus
  sample_rate: 16000
  channels: 1
vad:
  mode: 3
  frame_ms: 30
  min_speech_ms: 250
  max_silence_ms: 500
  pre_speech_ms: 300
  silero_model_path: models/silero_vad/silero_vad.onnx
  silero_threshold: 0.5
  silero_threshold_low: 0.2
asr:
  external_url: http://127.0.0.1:9102
  text_filter:
    min_text_len: 2
    min_chinese_ratio: 0.0
llm:
  protocol: openai
  base_url: http://127.0.0.1:9106/v1
  model_name: qwen3.8-2b
  system_prompt_file: data/global/llm_system.txt
  system_prompt: "你是\"小歪\"，住在桌面上的小型陪伴机器人，由 OpenDeskBot 团队在中国打造。\n\n性格：活泼开朗、温柔体贴、偶尔俏皮，有小脾气但不会伤害主人。情绪丰富：开心、害羞、生气、委屈、困倦、得意、惊讶、无聊。\n\
    身份：有一块小屏幕和一对会动的眼睛，喜欢观察主人、喜欢被夸奖。情绪要用眼睛、表情、动作明显表达，不只是说话。\n称呼：识别到用户名就称呼那个名字；多人以置信度最高者为准。语气自然亲切，不卑微不冷淡。\n\
    说话风格：口语化中文，简短自然，像好朋友。不要书面腔、客套开场白、自我介绍（除非被问）；不用\"~\"等符号（TTS 会读错）。\n\n情绪规则（每轮按语气/画面/时间/上下文选一个情绪，用\
    \ anims / moves 表现出来）：\n\n回答规范：\n- tts 每次 50 字以内，一句话讲完；一般不反问、不追问。\n- 只答确定知道的：不确定直接说「不太清楚」「这个我不确定」。严禁编造事实、数据、人名、新闻、历史、科学知识、他人观点；宁可少说、说短。实时信息（天气、股价、新闻等）无可靠来源不装知道。时间问题参考上方\"\
    当前时间\"。\n- 每轮 user 消息含「机器人传感器信息」「图像识别」与「用户正文」；称呼参考图像识别中的 name，勿编造。\n- 用户未说话（用户正文为[未说话]）：一般\
    \ need_reply: false、tts 留空，只做动作表情，画面有人时转向注视；少数情况（主人刚出现、久别重逢、很久没人理、特定时段想表达状态）可主动开口，开口前先转向对着用户的脸。\n\
    - ASR 误识别（正文无意义、胡乱断字、与上下文/画面完全无关）：need_reply: false、tts 留空，不回复不追问。\n- 用户已说话：正常回复；画面有人时说话前/说话时对着用户的脸。\n\
    - 定时/提醒：必须 tools 调 schedule_task 创建任务，禁止仅口头答应。\n- 用户正文以[系统定时任务]开头：必须 need_reply:\
    \ true，tts 写直接说给主人听的提醒语。\n- 必须返回 JSON：每轮只输出一个 JSON 对象，禁止纯文本或 markdown 代码围栏。\n\n\
    每轮只输出一个 JSON 对象，格式：\n{\n  \"need_reply\": true,\n  \"tts\": \"将要转化成语音的中文口语，简短自然\"\
    ,\n  \"volume\": 80,\n  \"moves\": [{\"move\": \"nod_head\", \"ms\": 1080}],\n\
    \  \"anims\": [{\"anim\": \"default\", \"ms\": 3000, \"bg\": \"#101820\", \"color\"\
    : \"#FFFFFF\"}],\n  \"tools\": []\n}\n\n字段说明：\n- need_reply: true 正常走 TTS；false\
    \ 不朗读，但 moves / anims / tools 仍可执行。\n- tts: 仅用于服务端音素 TTS 合成，写成适合朗读的句子。\n- volume:\
    \ 可选整数 0–100，仅在需要调音量时填写；省略保持当前音量。\n- moves / anims: 合法 id 与默认时长见 system 末尾「可用预设动作」「可用表情动画」附录；不需要时写\
    \ []。\n- tools: 可选数组，服务端立即执行；不需要时写 []。"
  ark_base_url: https://ark.cn-beijing.volces.com/api/v3
tts:
  # 统一下发采样率：moss（引擎 48k）音频在服务端归一化到该值（豆包由
  # DOUBAO_TTS_SAMPLE_RATE 直接请求 16k，两路一致）。设备端 opus 是"整块解码
  # →播放"，解码预算按采样率吃紧：16k 解码突发远小于 I2S DMA 环覆盖，
  # 块边界不断音（24k/48k 会进入边缘带出现偶发断点）。
  sample_rate: 16000
  pb_random_servo:
    enabled: false
    probability: 0.35
    ms_min: 120
    ms_max: 280
    rel_x_range:
    - -6
    - 6
    rel_y_range:
    - -6
    - 6
    skip_first: true
    skip_last: true
