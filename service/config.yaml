camera_face:
  external_url: http://127.0.0.1:9103
  external_timeout_s: 10
  frame_width: 640
  frame_height: 480
  face_track_max_dist_px: 90
  face_track_max_lost_frames: 18
  horizontal_fov_deg: 120
  eye_yaw_range_deg: 50
  frontal_angle_threshold_deg: 15
  identity_similarity_threshold: 0.4
  mode: insightface
voiceprint:
  external_url: http://127.0.0.1:9104
  external_timeout_s: 5
  identity_similarity_threshold: 0.5
  sample_max_age_s: 60
  mode: vpr
debug:
  asr_auto_reply: true
  live_service: false
  camera_servo_auto_mode: ''
server:
  host: 0.0.0.0
  port: 9000
  ws_path: /asr_chat
  # ROM 填写完整启动接口，例如 https://example.com/robot/bootstrap。
  # 下列地址由启动接口下发；根相对地址基于该接口的 origin，不自动补路径前缀。
  # 可改成独立主机/端口的完整 wss:// 或 https:// 地址；对应路径需由网关路由。
  device_bootstrap:
    realtime_url: /asr_chat
    camera_url: /camera_uplink
    camera_enabled: true
    face_pack_base_url: /api/device/face-pack
  ws_ping_interval: 120
  ws_ping_timeout: 300
  send_face_info_to_asr_chat: false
  asr_chat_device_pb_only: true
  asr_chat_minimal_device_downlink: false
  max_concurrent_asr: 6
conversation:
  flecket:
    # 外部 Agent 服务；迁移至云端时修改主机名，或设置 FLECKET_URL。
    url: ws://127.0.0.1:9110/v1/realtime?model=agent_265823d9ffd34dd7
    agents:
      - name: 豆包llm_tts
        model: agent_265823d9ffd34dd7
      - name: 豆包 Turbo Fast · 本机中文语音
        model: agent_0fe464d97c384816
      - name: 豆包 Lite Fast · 本机中文语音
        model: agent_98c0730893184056
audio:
  input_codec: opus
  output_codec: opus
  sample_rate: 16000
  channels: 1
