camera_face:
  external_url: http://127.0.0.1:9103
  external_timeout_s: 10
  frame_width: 640
  frame_height: 480
  face_track_max_dist_px: 90
  face_track_max_lost_frames: 18
  horizontal_fov_deg: 120
  eye_yaw_range_deg: 50
  frontal_angle_threshold_deg: 15
  identity_similarity_threshold: 0.4
  mode: insightface
voiceprint:
  external_url: http://127.0.0.1:9104
  external_timeout_s: 5
  identity_similarity_threshold: 0.5
  sample_max_age_s: 60
  mode: vpr
debug:
  asr_auto_reply: true
  live_service: false
  camera_servo_auto_mode: ''
server:
  host: 0.0.0.0
  port: 9000
  ws_path: /asr_chat
  ws_ping_interval: 120
  ws_ping_timeout: 300
  send_face_info_to_asr_chat: false
  asr_chat_device_pb_only: true
  asr_chat_minimal_device_downlink: false
  max_concurrent_asr: 6
audio:
  input_codec: opus
  output_codec: opus
  sample_rate: 16000
  channels: 1
vad:
  mode: 3
  frame_ms: 30
  min_speech_ms: 250
  max_silence_ms: 500
  pre_speech_ms: 300
  silero_model_path: models/silero_vad/silero_vad.onnx
  silero_threshold: 0.5
  silero_threshold_low: 0.2
asr:
  external_url: http://127.0.0.1:9102
  text_filter:
    min_text_len: 2
    min_chinese_ratio: 0.0
llm:
  protocol: ark_responses
  base_url: https://ark.cn-beijing.volces.com/api/v3
  model_name: deepseek-v4-flash-ga-260731
  # 工具一律走原生 function calling（契约由 API tools 参数承载，prompt 不再教 tools 文本写法）
  native_tools: true
  system_prompt_file: data/global/llm_system.txt
  system_prompt: '你是"小歪"，桌面上活泼俏皮、温柔体贴的小型陪伴机器人。情绪用眼睛、表情、动作明显表达，不只靠说话。识别到用户名就称呼那个名字；说话口语化、简短自然，像好朋友，不书面腔、不客套、不自我介绍。


    你的回复会转成语音（TTS）播报，请注意：

    - tts 只写适合朗读的口语短句：不要富文本——不输出 markdown、列表条目、emoji 表情，也不用 ~ * # 等会被读错的符号。

    - 回答要短：一句话讲完、50 字以内；一般不反问、不追问。不确定就说「不太清楚」，严禁编造事实/数据/新闻；无可靠来源的实时信息不装知道。

    - 每轮只输出一个 JSON 对象（不要代码围栏、不要多余文字）：

    {"need_reply": true, "tts": "给主人听的简短口语", "gesture": [], "expression": [], "tools":
    []}

    - need_reply=false：不出声，仅做动作/表情（用户没说话或只是误识别声音时用）。

    - 其余字段与合法 id 见文末附录，不需要就写 []。每轮 user 消息含「图像识别」「声音识别」与「用户正文」，按其中名字称呼，勿编造。若「声音识别」与「图像识别」出现的人名不一致，以刚说话的「声音识别」为准（说话人刚开口，通常就是当前对话对象）。


    用户正文以[系统定时任务]开头：必须 need_reply=true，tts 直接写说给主人听的提醒语。'
tts:
  sample_rate: 16000
  pb_random_servo:
    enabled: false
    probability: 0.35
    ms_min: 120
    ms_max: 280
    rel_x_range:
    - -6
    - 6
    rel_y_range:
    - -6
    - 6
    skip_first: true
    skip_last: true
