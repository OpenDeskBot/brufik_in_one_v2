{% extends "base_2c.html" %}
{% block page_title %}账户 · 小歪{% endblock %}
{% block extra_head %}<script src="{{ url_for('static', filename='vendor/vue.global.prod.min.js') }}"></script>{% endblock %}
{% block content %}
<div id="advancedApp">
  <div class="pagehd">
    <div>
      <div class="eyebrow">ACCOUNT</div>
      <h1>账户</h1>
      <p>账号资料与密码都在这里管理。</p>
    </div>
  </div>

  <div class="adv-panel">
    <div class="panel-head">
      <div><b>账号资料</b><small>[[ user.email ]]</small></div>
    </div>
    <div>
      <form class="inline-form" @submit.prevent="saveProfile">
        <input class="tinput" v-model="profileName" placeholder="显示名称">
        <button type="submit" class="btn primary">保存名称</button>
      </form>
      <form class="password-form" @submit.prevent="changePassword">
        <input class="tinput" v-model="password.old_password" type="password" placeholder="旧密码">
        <input class="tinput" v-model="password.new_password" type="password" placeholder="新密码">
        <input class="tinput" v-model="password.confirm_password" type="password" placeholder="确认新密码">
        <button type="submit" class="btn primary">更新密码</button>
      </form>
      <form method="post" action="{{ url_for('auth.logout') }}">
        <button type="submit" class="btn ghost">退出登录</button>
      </form>
    </div>
  </div>

  <p class="lead" v-if="msg">[[ msg ]]</p>
</div>
{% endblock %}
{% block scripts %}
<script>
const { createApp } = Vue;
createApp({
  delimiters:['[[',']]'],
  data(){ return {
    msg:'', loading:false,
    user:{email:'',display_name:''}, profileName:'',
    password:{old_password:'',new_password:'',confirm_password:''},
  }; },
  methods:{
    async api(url, opts){
      const r=await fetch(url, opts||{});
      const d=await r.json().catch(()=>({ok:false,error:'响应解析失败'}));
      if(!r.ok || d.ok===false) throw new Error(d.error||('HTTP '+r.status));
      return d;
    },
    applyPayload(d){
      this.user=d.user||this.user;
      this.profileName=this.user.display_name||'';
    },
    async load(){
      this.loading=true; this.msg='';
      try{ this.applyPayload(await this.api('/api/advanced')); }
      catch(e){ this.msg=e.message||'加载失败'; }
      finally{ this.loading=false; }
    },
    async saveProfile(){
      try{
        const d=await this.api('/api/advanced/profile',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({display_name:this.profileName})});
        this.user=d.user; this.profileName=d.user.display_name||''; this.msg='名称已保存';
      }catch(e){ this.msg=e.message||'保存失败'; }
    },
    async changePassword(){
      try{
        await this.api('/api/advanced/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.password)});
        this.password={old_password:'',new_password:'',confirm_password:''}; this.msg='密码已更新';
      }catch(e){ this.msg=e.message||'更新失败'; }
    },
  },
  mounted(){ this.load(); },
}).mount('#advancedApp');
</script>
{% endblock %}
